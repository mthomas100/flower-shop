name: FlowerShop
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    visionOS: "26.0"
  createIntermediateGroups: true
packages:
  FlowerAssets:
    path: Packages/FlowerAssets
settings:
  base:
    SWIFT_VERSION: "5.0"
    # Empty is fine for the simulator. For a headset, pick your team in Signing & Capabilities,
    # or pass it at build time: xcodebuild ... DEVELOPMENT_TEAM=YOUR_TEAM_ID
    DEVELOPMENT_TEAM: ""
targets:
  FlowerShop:
    type: application
    platform: visionOS
    sources:
      - path: FlowerShop
    dependencies:
      - package: FlowerAssets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.FlowerShop
        PRODUCT_NAME: Flower Shop
        INFOPLIST_FILE: FlowerShop/App/Info.plist
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Flower Shop
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "7"
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
